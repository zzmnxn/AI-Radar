[project]
name = "ai-radar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic==2.12.5", "defusedxml>=0.7.1,<1", "pyyaml>=6.0.3,<7"]

[dependency-groups]
dev = ["pytest>=9.2.0,<10", "ruff>=0.15,<1"]

[tool.setuptools]
packages = ["radar"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]

[tool.setuptools.package-data]
radar = ["migrations/*.sql"]
