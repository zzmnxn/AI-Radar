name: Check AI Radar

on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: radar-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - run: python -m pip install . "pytest>=9,<10" ruff==0.15.0
      - run: |
          ruff check radar tests
          ruff format --check radar tests
          python -m pytest -q
          python -m radar export-schema
          python -m radar run --no-llm --data "$RUNNER_TEMP/radar-preview"
          python -m radar validate-data --data "$RUNNER_TEMP/radar-preview"
      - run: |
          npm ci
          npm test
          npm run gen:types
          npm run build
        working-directory: web
        env:
          RADAR_DATA: ${{ runner.temp }}/radar-preview
          VITE_BASE: /ai-radar/
      - run: git diff --exit-code -- schemas web/src/lib/types.gen.ts
