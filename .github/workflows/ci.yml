name: Check AI Radar

on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: radar-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - run: python -m pip install . "pytest>=9,<10" ruff==0.15.0
      - run: |
          ruff check radar tests
          ruff format --check radar tests
          python -m pytest -q
          python -m radar export-schema
          python -m radar run --no-llm --data "$RUNNER_TEMP/radar-preview"
          python -m radar validate-data --data "$RUNNER_TEMP/radar-preview"
      - run: |
          npm ci
          npm test
          npm run gen:types
          npm run build
        working-directory: web
        env:
          RADAR_DATA: ${{ runner.temp }}/radar-preview
          VITE_BASE: /ai-radar/
      - run: git diff --exit-code -- schemas web/src/lib/types.gen.ts
